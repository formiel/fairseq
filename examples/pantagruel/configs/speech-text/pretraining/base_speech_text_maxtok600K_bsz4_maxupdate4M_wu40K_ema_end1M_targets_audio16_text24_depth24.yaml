# @package _group_
hydra:
  run:
    dir: /lustre/fsn1/projects/rech/zbk/umz16dj/tmp/hydra/outputs/${hydra.job.name}/${hydra.job.num}
  sweep:
    dir: /lustre/fsn1/projects/rech/zbk/umz16dj/tmp/hydra/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

common:
  fp16: true
  log_format: json
  log_interval: 500
  tensorboard_logdir: ???
  # min_loss_scale: 1e-6
  fp16_no_flatten_grads: true
  # memory_efficient_fp16: true
  # fp16_scale_tolerance: 0.25
  min_loss_scale: 1e-6
  time_limit: ???
  user_dir: ???

checkpoint:
  # save_interval: 1
  save_interval_updates: 40000
  # keep_interval_updates: 1
  # no_epoch_checkpoints: true
  # keep_best_checkpoints: 10
  # keep_last_epochs: 10
  # patience: 10
  save_dir: ???

task:
  _name: pantagruel_multimodal_pretraining
  audio_ratio: 14
  text_ratio: 1
  # update_freq: [4]
  vocab_path: ???
  audio:
    data: ???
    max_sample_size: 320000
    min_sample_size: 32000
    normalize: true
    precompute_mask_config: {}
  text:
    data: ???
    sample_break_mode: none
    tokens_per_sample: 512
    include_target_tokens: true
    random_token_prob: 0
    leave_unmasked_prob: 0
    include_index: true
    skip_masking: true
    d2v2_multi: true
    mask_idx_in_vocab: true

dataset:
  num_workers: 6
  max_tokens: 600000
  # batch_size: 16
  batch_size: 4
  # ignore_unused_valid_subsets: true
  skip_invalid_size_inputs_valid_test: true
  # validate_interval: 1
  # required_batch_size_multiple: 1
  # disable_validation: true
  # train_subset: train
  # valid_subset: valid

distributed_training:
  # find_unused_parameters: true
  distributed_world_size: ???
  ddp_backend: legacy_ddp
  distributed_port: ???

criterion:
  _name: pantagruel_multi_loss
  log_keys:
  - ema_decay
  - target_var
  - pred_var
  - model_norm
  - ema_norm
  - masked_pct
  - loss_
  - sample_size_

optimization:
  clip_norm: 1
  lr: [0.0003]
  max_update: 4000000
  update_freq: [1]
  # max_epoch: 10

optimizer:
  _name: composite
  dynamic_groups: true
  groups:
    default:
      lr_float: 0.0003
      optimizer:
        _name: adam
        adam_betas: [0.9, 0.98]
        adam_eps: 1e-06
        weight_decay: 0.01
      lr_scheduler:
        _name: cosine
        warmup_updates: 40000

lr_scheduler: pass_through

model:
  _name: pantagruel_multi
  # skip_mode: 'TEXT'
  dummy_factor: 0.0

  loss_beta: 0
  loss_scale: null

  depth: 24
  embed_dim: 768
  clone_batch: 8

  ema_decay: 0.9999
  ema_end_decay: 0.99999
  ema_anneal_end_step: 1000000
  ema_encoder_only: false # speech: false, text: true

  average_top_k_layers: "{'audio': 16, 'text': 24}"
  instance_norm_target_layer: true
  layer_norm_target_layer: false
  layer_norm_targets: false

  layerdrop: 0.0
  norm_eps: 1e-5

  use_token_type_embeddings: true

  # shared_decoder:
  #   input_dropout: 0.1
  #   decoder_dim: 384
  #   decoder_groups: 16
  #   decoder_kernel: 7
  #   decoder_layers: 5
  #   decoder_residual: false
  #   projection_layers: 2
  #   projection_ratio: 2.0

  # supported_modality: 'AUDIO'

  modalities:
    audio:
      feature_encoder_spec: '[(512, 10, 5)] + [(512, 3, 2)] * 4 + [(512,2,2)] + [(512,2,2)]'
      conv_pos_depth: 5
      conv_pos_width: 95
      conv_pos_groups: 16
      prenet_depth: 0
      mask_prob: 0.5
      mask_prob_adjust: 0.05
      inverse_mask: false
      mask_length: 5
      mask_noise_std: 0.01
      mask_dropout: 0
      add_masks: false
      ema_local_encoder: false
      use_alibi_encoder: true
      prenet_layerdrop: 0.05
      prenet_dropout: 0.1
      learned_alibi_scale: true
      learned_alibi_scale_per_head: true
      local_grad_mult: 2.5
      decoder:
        input_dropout: 0.1
        decoder_dim: 384
        decoder_groups: 16
        decoder_kernel: 7
        decoder_layers: 4
    text:
      mask_prob: 0.58
      mask_length: 3
      mask_noise_std: 0.01
      prenet_depth: 0
      # local_grad_mult: 1.0
      # use_alibi_encoder: true
      # learned_alibi_scale: true
      # learned_alibi_scale_per_head: true
      decoder:
        input_dropout: 0.1
        decoder_dim: 768
        decoder_groups: 1
        decoder_kernel: 9
        decoder_layers: 5
        decoder_residual: false
        projection_layers: 2
        projection_ratio: 2.0